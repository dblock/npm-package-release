name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional numeric release version.
        type: string
        required: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Release Package
    uses: dblock/npm-package-release/.github/workflows/release.yml@v0.1.0
    with:
      version: ${{ inputs.version }}
