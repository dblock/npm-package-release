name: Test

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  test:
    name: Test Node ${{ matrix.entry.node }} on ${{ matrix.entry.label }}
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        entry:
          - { id: ubuntu-22, node: '22.14.0', os: ubuntu-latest, label: Ubuntu, wrapper: '[]', artifacts: '' }
          - { id: ubuntu-24, node: '24', os: ubuntu-latest, label: Ubuntu, wrapper: '[]', artifacts: '' }
          - { id: ubuntu-26, node: '26', os: ubuntu-latest, label: Ubuntu, wrapper: '["c8","--all","--include=dist/**/*.js","--include=bin/**/*.js","--include=scripts/**/*.js","--include=npr.config.js","--exclude=dist/contracts.js","--reporter=text","--reporter=lcov"]', artifacts: coverage/lcov.info }
          - { id: windows-26, node: '26', os: windows-latest, label: Windows, wrapper: '[]', artifacts: '' }
          - { id: macos-26, node: '26', os: macos-latest, label: macOS, wrapper: '[]', artifacts: '' }
    uses: dblock/testlanes/.github/workflows/testlanes.yml@b3be745a8c0f0344824487d1f2f1a567c546cbce
    with:
      framework: node
      runs-on: ${{ matrix.entry.os }}
      install-node-version: '26'
      node-version: ${{ matrix.entry.node }}
      pattern: test/*.test.js
      setup: npm run build
      shards: 4
      artifact-prefix: test-${{ matrix.entry.id }}
      test-wrapper: ${{ matrix.entry.wrapper }}
      artifacts: ${{ matrix.entry.artifacts }}

  coverage:
    name: Upload Coverage
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check Out Source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Download Shard Coverage
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: test-ubuntu-26-artifacts-*
          path: shards
      - name: List Coverage Reports
        id: reports
        run: echo "files=$(find shards -name lcov.info | sort | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
      - name: Upload Coverage to Coveralls
        uses: coverallsapp/github-action@v2.3.8
        with:
          files: ${{ steps.reports.outputs.files }}
