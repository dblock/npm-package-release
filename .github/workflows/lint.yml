name: Lint

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint Code and Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check Out Source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Check Local Lint Claim
        if: github.event_name == 'pull_request'
        uses: dblock/already-tested@v0.2.0
        id: tested
        with:
          check: lint-ubuntu-latest-${{ runner.arch }}-node-26
      - name: Cache npm Downloads
        if: steps.tested.outputs.skip != 'true'
        uses: actions/cache@v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-${{ runner.arch }}-
      - name: Set Up Node
        if: steps.tested.outputs.skip != 'true'
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '26'
          package-manager-cache: false
      - name: Install Development Dependencies
        if: steps.tested.outputs.skip != 'true'
        run: npm ci
      - name: Run Lint
        if: steps.tested.outputs.skip != 'true'
        run: npm run lint
